<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2024"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f2ea"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#2d3036" stroke-width="6"/>

  <!-- Subtle grid pattern on background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="120" y1="24" x2="120" y2="488"/>
    <line x1="216" y1="24" x2="216" y2="488"/>
    <line x1="312" y1="24" x2="312" y2="488"/>
    <line x1="408" y1="24" x2="408" y2="488"/>
    <line x1="24" y1="120" x2="488" y2="120"/>
    <line x1="24" y1="216" x2="488" y2="216"/>
    <line x1="24" y1="312" x2="488" y2="312"/>
    <line x1="24" y1="408" x2="488" y2="408"/>
  </g>

  <!-- Open Editorial Book / Notebook Sheets -->
  <g filter="url(#shadow)">
    <!-- Back page (left) -->
    <rect x="96" y="112" width="150" height="270" rx="12" fill="#ebe6da" stroke="#d5cfc2" stroke-width="3"/>
    <!-- Back page (right) -->
    <rect x="266" y="112" width="150" height="270" rx="12" fill="#ebe6da" stroke="#d5cfc2" stroke-width="3"/>
    <!-- Front page (left) -->
    <rect x="108" y="124" width="144" height="258" rx="8" fill="url(#pageGrad)"/>
    <!-- Front page (right) -->
    <rect x="260" y="124" width="144" height="258" rx="8" fill="url(#pageGrad)"/>

    <!-- Spine / Center fold bar -->
    <rect x="248" y="108" width="16" height="290" rx="6" fill="url(#accentGrad)"/>
  </g>

  <!-- Left Page Details: Code Block & Lines -->
  <g>
    <!-- Code prompt badge "In [1]:" -->
    <rect x="124" y="152" width="46" height="14" rx="3" fill="#ea580c" opacity="0.18"/>
    <text x="128" y="163" font-family="Space Mono, monospace" font-size="9" font-weight="bold" fill="#c2410c">In [1]:</text>

    <!-- Code lines -->
    <rect x="124" y="174" width="108" height="6" rx="3" fill="#171717" opacity="0.75"/>
    <rect x="136" y="186" width="84" height="6" rx="3" fill="#52504b" opacity="0.6"/>
    <rect x="136" y="198" width="96" height="6" rx="3" fill="#52504b" opacity="0.6"/>

    <!-- Mini chart / Plot area -->
    <rect x="124" y="218" width="112" height="74" rx="6" fill="#f0ece3" stroke="#e2ddd3" stroke-width="2"/>
    <path d="M 132 276 Q 152 232 176 254 T 224 230" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="176" cy="254" r="3.5" fill="#ea580c"/>
    <circle cx="224" cy="230" r="3.5" fill="#ea580c"/>

    <!-- Lined note stripes in bottom half (Slide-printer note area) -->
    <line x1="124" y1="312" x2="236" y2="312" stroke="#d5cfc2" stroke-width="1.8" stroke-dasharray="2,2"/>
    <line x1="124" y1="326" x2="236" y2="326" stroke="#d5cfc2" stroke-width="1.8" stroke-dasharray="2,2"/>
    <line x1="124" y1="340" x2="236" y2="340" stroke="#d5cfc2" stroke-width="1.8" stroke-dasharray="2,2"/>
    <line x1="124" y1="354" x2="236" y2="354" stroke="#d5cfc2" stroke-width="1.8" stroke-dasharray="2,2"/>
  </g>

  <!-- Right Page Details: Typeset Editorial Heading & Typography -->
  <g>
    <!-- Section Title & Rule -->
    <rect x="276" y="152" width="112" height="12" rx="4" fill="#171717"/>
    <line x1="276" y1="172" x2="388" y2="172" stroke="#c2410c" stroke-width="2"/>

    <!-- Editorial Prose Lines -->
    <rect x="276" y="184" width="112" height="6" rx="3" fill="#52504b" opacity="0.75"/>
    <rect x="276" y="196" width="104" height="6" rx="3" fill="#52504b" opacity="0.65"/>
    <rect x="276" y="208" width="110" height="6" rx="3" fill="#52504b" opacity="0.65"/>
    <rect x="276" y="220" width="80" height="6" rx="3" fill="#52504b" opacity="0.65"/>

    <!-- Typeset Math Box -->
    <rect x="276" y="238" width="112" height="42" rx="6" fill="#f8f6f0" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4,2"/>
    <!-- Math symbol sigma / integral -->
    <path d="M 292 266 Q 296 250 304 250 Q 312 250 316 266" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="324" y1="258" x2="376" y2="258" stroke="#171717" stroke-width="2"/>
    <line x1="334" y1="250" x2="366" y2="250" stroke="#52504b" stroke-width="1.5"/>
    <line x1="330" y1="268" x2="370" y2="268" stroke="#52504b" stroke-width="1.5"/>

    <!-- Lined note stripes in right bottom half -->
    <line x1="276" y1="300" x2="388" y2="300" stroke="#d5cfc2" stroke-width="1.5"/>
    <line x1="276" y1="314" x2="388" y2="314" stroke="#d5cfc2" stroke-width="1.5"/>
    <line x1="276" y1="328" x2="388" y2="328" stroke="#d5cfc2" stroke-width="1.5"/>
    <line x1="276" y1="342" x2="388" y2="342" stroke="#d5cfc2" stroke-width="1.5"/>
    <line x1="276" y1="356" x2="388" y2="356" stroke="#d5cfc2" stroke-width="1.5"/>
  </g>

  <!-- Editorial Press / Typst Sparkle Badge in bottom corner -->
  <g transform="translate(382, 382)">
    <circle cx="0" cy="0" r="34" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
    <path d="M 0 -18 L 4 -6 L 16 -4 L 6 4 L 8 16 L 0 9 L -8 16 L -6 4 L -16 -4 L -4 -6 Z" fill="#ffffff"/>
  </g>
</svg>
